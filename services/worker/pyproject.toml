[project]
name = "sim-worker"
version = "0.1.0"
description = "Worker de reconstrução 3D (contrato HTTP + HMAC). VGGTFace entra após a Fase 0."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
# código numérico de visão (linhas longas, laços por pixel): sem as regras de estilo, mantém as de erro e segurança
"app/face/*" = ["E501", "E702", "B905", "S301"]
"scripts/*" = ["E501", "E702", "B905", "S301"]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
# numpy/OpenCV/MediaPipe/SciPy sem tipos completos: o pacote de visão não passa pelo modo estrito
module = ["app.face.*", "cv2.*", "mediapipe.*", "scipy.*", "pygltflib.*"]
ignore_errors = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
