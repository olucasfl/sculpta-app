name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Os testes da API sobem Postgres em memória (PGlite): não precisa de serviço no CI.
      - run: pnpm turbo run lint typecheck test build
      - run: pnpm audit --prod --audit-level high
      - uses: actions/upload-artifact@v4
        with:
          name: template-head
          path: packages/face-assets/dist/template-head.glb

  worker:
    runs-on: ubuntu-latest
    needs: typescript
    defaults:
      run:
        working-directory: services/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: template-head
          path: services/worker/assets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt pip-audit
      - run: ruff check . && ruff format --check .
      - run: mypy app
      - run: pytest -q
      - run: pip-audit -r requirements.txt
