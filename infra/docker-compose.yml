# Ambiente completo com Docker (Postgres 16, MinIO, API, web e worker mock).
#   pnpm --filter @sim/face-assets build          # gera o template usado pelo worker mock
#   docker compose -f infra/docker-compose.yml up -d --build
#   http://localhost:8080   (MinIO console: http://localhost:9001)
#
# Sem Docker, veja o README: `pnpm db:dev` + `pnpm dev`.
# A fila de reconstrução usa o próprio Postgres (ADR 0005): não há Redis.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sim
      POSTGRES_PASSWORD: sim
      POSTGRES_DB: simulador
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sim -d simulador']
      interval: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
      # Upload direto do navegador (URL pré-assinada) a partir do web em :8080.
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:8080
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]

  # Bucket privado (sem acesso anônimo).
  minio-setup:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio12345; do sleep 1; done;
      mc mb --ignore-existing local/simulador;
      mc anonymous set none local/simulador;
      "

  migrate:
    build: { context: .., dockerfile: apps/api/Dockerfile, target: migrate }
    environment:
      DATABASE_URL: postgresql://sim:sim@postgres:5432/simulador
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    build: ../services/worker
    environment:
      WORKER_SECRET: troque-este-segredo-do-worker-com-32-caracteres
      RECONSTRUCTOR: mock

  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql://sim:sim@postgres:5432/simulador
      JWT_SECRET: troque-isto-por-um-segredo-com-pelo-menos-32-caracteres
      COOKIE_SECURE: 'false'
      NODE_ENV: development
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: simulador
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      WORKER_URL: http://worker:8000
      WORKER_SECRET: troque-este-segredo-do-worker-com-32-caracteres
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-setup: { condition: service_completed_successfully }
    ports: ['3000:3000']

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    environment:
      API_UPSTREAM: http://api:3000
      STORAGE_ORIGIN: http://localhost:9000
    depends_on: [api]
    ports: ['8080:80']

volumes:
  pgdata:
  miniodata:
