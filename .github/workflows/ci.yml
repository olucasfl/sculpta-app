name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Os testes da API sobem Postgres em memória (PGlite): não precisa de serviço no CI.
      - run: pnpm turbo run lint typecheck test build
      - run: pnpm audit --prod --audit-level high
      - uses: actions/upload-artifact@v4
        with:
          name: template-head
          path: packages/face-assets/dist/template-head.glb

  worker:
    runs-on: ubuntu-latest
    needs: typescript
    defaults:
      run:
        working-directory: services/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: template-head
          path: services/worker/assets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt pip-audit
      - run: ruff check . && ruff format --check .
      - run: mypy app
      - run: pytest -q
      - run: pip-audit -r requirements.txt

  # Testes de tela (Playwright + axe) em pilha isolada. O 3D roda em WebGL por software, então é lento: só desktop.
  e2e:
    runs-on: ubuntu-latest
    needs: typescript
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@sim/contracts --filter=@sim/face-assets
      - run: pnpm --filter @sim/web exec playwright install --with-deps chromium
      - run: pnpm --filter @sim/web e2e --project=desktop-1440x900
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: apps/web/e2e/screenshots
